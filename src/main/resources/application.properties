spring.application.name=stark_vms_server
spring.config.import=optional:file:./.env[.properties]
# Render (and most hosts) inject PORT; SERVER_PORT is the local override.
server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.data.web.pageable.max-page-size=100

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS}

app.auth.jwt-secret=${APP_JWT_SECRET}
app.auth.token-lifetime-seconds=${APP_TOKEN_LIFETIME_SECONDS:900}
app.auth.max-password-bytes=${APP_MAX_PASSWORD_BYTES:72}
app.auth.admin-email=${APP_ADMIN_EMAIL:}
app.auth.admin-password=${APP_ADMIN_PASSWORD:}
